<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Restaurant Voice Billing</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; text-align: center; }
    button, select { font-size: 20px; padding: 14px 28px; cursor: pointer; }
    #said, #reply { margin-top: 24px; font-size: 18px; }
    .menu { margin-top: 40px; text-align: left; }
    .menu h2 { text-align: center; }
    .cats { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .cat { background: #f4f4f4; border-radius: 8px; padding: 12px 16px; width: 280px; }
    .cat h3 { margin: 0 0 8px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; }
    .note { text-align: center; color: #666; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Restaurant Voice Billing</h1>
  <p>Pick a language, click the button and say your order.</p>
  <select id="lang">
    <option value="en-IN">English</option>
    <option value="hi-IN">हिन्दी</option>
    <option value="te-IN">తెలుగు</option>
  </select>
  <button onclick="startListening()">🎤 Speak your order</button>
  <div id="said"></div>
  <div id="reply"></div>

  <div class="menu">
    <h2>Menu</h2>
    <div class="cats">
      {% for category, items in menu.items() %}
      <div class="cat">
        <h3>{{ category }}</h3>
        {% for item in items %}
        <div class="row"><span>{{ item.name }}</span><span>₹{{ item.price|int }}</span></div>
        {% endfor %}
      </div>
      {% endfor %}
    </div>
    <div class="note">Prices are before 5% GST.</div>
  </div>

  <script>
    function startListening() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("Please use Google Chrome."); return; }
      const langCode = document.getElementById("lang").value;
      const rec = new SR();
      rec.lang = langCode;
      document.getElementById("said").innerText = "Listening...";
      rec.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById("said").innerText = "You said: " + text;
        const res = await fetch("/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, lang: langCode.slice(0, 2) })
        });
        const data = await res.json();
        document.getElementById("reply").innerText = data.reply;
        const u = new SpeechSynthesisUtterance(data.reply);
        u.lang = langCode;
        speechSynthesis.speak(u);
      };
      rec.onerror = () => { document.getElementById("said").innerText = "Could not hear. Try again."; };
      rec.start();
    }
  </script>
</body>
</html>
